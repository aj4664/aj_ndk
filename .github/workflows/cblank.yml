name: Cache AOSP LLVM Source ARM64

on:
  workflow_dispatch:

jobs:
  sync-source:

    runs-on: ubuntu-24.04-arm

    steps:

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y \
          git \
          repo \
          python3 \
          python3-pip

    - name: Check arch
      run: |
        uname -m
        python3 - <<EOF
        import platform
        print(platform.machine())
        EOF

    - name: Cache AOSP source
      uses: actions/cache@v4
      with:
        path: |
          ~/aosp-llvm
        key: aosp-source-arm64-v1
        restore-keys: |
          aosp-source-arm64-

    - name: Sync AOSP LLVM
      run: |
        mkdir -p ~/aosp-llvm
        cd ~/aosp-llvm

        if [ ! -d ".repo" ]; then
          repo init \
            -u https://android.googlesource.com/platform/manifest \
            -b llvm-toolchain
        fi

        repo sync \
          -c \
          -j$(nproc) \
          --force-sync \
          --no-clone-bundle

    - name: Check source
      run: |
        cd ~/aosp-llvm

        echo "AOSP LLVM source ready"
        ls -la
        ls -la toolchain
