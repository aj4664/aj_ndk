name: Build LLVM ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y \
          git repo python3 python3-pip \
          build-essential cmake ninja-build \
          bison flex lld llvm \
          zlib1g-dev libxml2-dev \
          libedit-dev libncurses-dev \
          liblzma-dev \
          libssl-dev

    - name: Check arch
      run: |
        uname -m
        python3 - <<EOF
        import platform
        print(platform.machine())
        EOF

    - name: Sync AOSP LLVM
      run: |
        mkdir ~/aosp-llvm
        cd ~/aosp-llvm

        repo init \
          -u https://android.googlesource.com/platform/manifest \
          -b llvm-toolchain

        repo sync -c -j$(nproc)

    - name: Apply ARM64 patch
      run: |
        cd ~/aosp-llvm/toolchain/llvm_android

        cp $GITHUB_WORKSPACE/llvm-arm64-fix.patch .

        git apply llvm-arm64-fix.patch || true

    - name: Build LLVM
      run: |
        cd ~/aosp-llvm/toolchain/llvm_android

        chmod +x build.py

        ./build.py \
          --skip-tests \
          --no-musl \
          --no-build windows \
          -j$(nproc)

    - name: Pack output
      run: |
        cd ~/aosp-llvm

        tar -czf llvm-arm64.tar.gz out/

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: llvm-arm64
        path: ~/aosp-llvm/llvm-arm64.tar.gz
