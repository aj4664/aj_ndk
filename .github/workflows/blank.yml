name: Build LLVM ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install deps
      run: |
      
        sudo apt update
        sudo apt install -y 
        git repo python3 python3.11 python3.11-dev python3.11-venv python3-pip \
        build-essential cmake ninja-build \
        bison flex lld llvm clang \
        libc++-dev libc++abi-dev \
        libstdc++-12-dev \
        zlib1g-dev libxml2-dev \
        libedit-dev libncurses-dev \
        liblzma-dev \
        libssl-dev

    - name: Check arch
      run: |
        uname -m
        python3 - <<EOF
        import platform
        print(platform.machine())
        EOF
        
    - name: Cache AOSP repo
      uses: actions/cache@v4
      with:
        path: |
          ~/aosp-llvm/.repo
        key: aosp-llvm-repo-arm64-v1
        restore-keys: |
          aosp-llvm-repo-arm64-

    - name: Sync AOSP LLVM
      run: |
        mkdir -p ~/aosp-llvm
        cd ~/aosp-llvm

        repo init \
          -u https://android.googlesource.com/platform/manifest \
          -b llvm-toolchain

        repo sync \
          -c \
          -j$(nproc) \
          --force-sync \
          --no-clone-bundle

    - name: Setup ARM64 prebuilts
      run: |
        cd ~/aosp-llvm

        mkdir -p prebuilts/build-tools/linux-arm64/bin

        ln -sf /usr/bin/ninja prebuilts/build-tools/linux-arm64/bin/ninja
        ln -sf /usr/bin/bison prebuilts/build-tools/linux-arm64/bin/bison
        ln -sf /usr/bin/make prebuilts/build-tools/linux-arm64/bin/make

        mkdir -p prebuilts/clang/host
        ln -sfn /usr prebuilts/clang/host/linux-arm64

        mkdir -p prebuilts/cmake
        ln -sfn /usr prebuilts/cmake/linux-arm64

        mkdir -p prebuilts/python
        ln -sfn /usr prebuilts/python/linux-arm64

    - name: Apply ARM64 patch
      run: |
        cd ~/aosp-llvm/toolchain/llvm_android

        cp $GITHUB_WORKSPACE/patches/llvm-arm64-fix.patch .

        git apply llvm-arm64-fix.patch

        echo "ARM64 patch applied"

    - name: Build LLVM
      run: |
        cd ~/aosp-llvm

        python3 toolchain/llvm_android/build.py \
          --no-build windows \
          --skip-tests \
          --no-musl

    - name: Pack output
      run: |
        cd ~/aosp-llvm

        tar -czf llvm-arm64.tar.gz out/

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: llvm-arm64
        path: ~/aosp-llvm/llvm-arm64.tar.gz
