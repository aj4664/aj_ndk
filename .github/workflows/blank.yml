name: Build LLVM ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y \
          git repo python3 python3-pip \
          build-essential cmake ninja-build \
          bison flex lld llvm \
          zlib1g-dev libxml2-dev \
          libedit-dev libncurses-dev \
          liblzma-dev \
          libssl-dev

    - name: Check arch
      run: |
        uname -m
        python3 - <<EOF
        import platform
        print(platform.machine())
        EOF

    - name: Sync AOSP LLVM
      run: |
        mkdir ~/aosp-llvm
        cd ~/aosp-llvm

        repo init \
          -u https://android.googlesource.com/platform/manifest \
          -b llvm-toolchain

        TOTAL=$(repo list | wc -l)

        echo "Total projects: $TOTAL"

        repo sync \
          -c \
          -j$(nproc) \
          --force-sync \
          --no-clone-bundle \
          --verbose 2>&1 | while read line
        do
          echo "$line"

          if echo "$line" | grep -q "Fetching project"; then
            COUNT=$((COUNT+1))
            PERCENT=$((COUNT*100/TOTAL))

            echo "SYNC: $PERCENT% ($COUNT/$TOTAL)"
          fi
        done

        echo "SYNC: 100%"

    - name: Setup ARM64 prebuilts
      run: |
        cd ~/aosp-llvm

        mkdir -p prebuilts/build-tools/linux-arm64/bin

        ln -sf /usr/bin/ninja prebuilts/build-tools/linux-arm64/bin/ninja
        ln -sf /usr/bin/bison prebuilts/build-tools/linux-arm64/bin/bison
        ln -sf /usr/bin/make prebuilts/build-tools/linux-arm64/bin/make

        mkdir -p prebuilts/clang/host
        ln -sfn /usr prebuilts/clang/host/linux-arm64

        mkdir -p prebuilts/cmake
        ln -sfn /usr prebuilts/cmake/linux-arm64

        mkdir -p prebuilts/python
        ln -sfn /usr prebuilts/python/linux-arm64

    - name: Apply ARM64 patch
      run: |
        cd ~/aosp-llvm/toolchain/llvm_android

        cp $GITHUB_WORKSPACE/llvm-arm64-fix.patch .

        git apply llvm-arm64-fix.patch || true

    - name: Build LLVM
      run: |
        cd ~/aosp-llvm/toolchain/llvm_android

        chmod +x build.py

        ./build.py \
          --skip-tests \
          --no-musl \
          --no-build windows \
          -j$(nproc)

    - name: Pack output
      run: |
        cd ~/aosp-llvm

        tar -czf llvm-arm64.tar.gz out/

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: llvm-arm64
        path: ~/aosp-llvm/llvm-arm64.tar.gz
